# =============================================================================
# OpenTelemetry Collector en la EC2
#   receivers : otlp (la app), hostmetrics (recursos del servidor),
#               prometheus (temperatura desde node-exporter)
#   exporters : otlphttp -> OpenObserve (organizacion "default")
# =============================================================================
receivers:
  otlp:
    protocols:
      http:
        endpoint: 0.0.0.0:4318
      grpc:
        endpoint: 0.0.0.0:4317

  hostmetrics:
    root_path: /hostfs
    collection_interval: 15s
    scrapers:
      cpu:
        metrics:
          system.cpu.utilization: { enabled: true }
      load: {}
      memory:
        metrics:
          system.memory.utilization: { enabled: true }
      network: {}
      disk: {}
      filesystem:
        metrics:
          system.filesystem.utilization: { enabled: true }
      paging: {}
      processes: {}

  prometheus:
    config:
      scrape_configs:
        - job_name: temperatura
          scrape_interval: 15s
          static_configs:
            - targets: ["127.0.0.1:9100"]
          metric_relabel_configs:
            - source_labels: [__name__]
              regex: "node_(hwmon_temp_celsius|thermal_zone_temp|hwmon_chip_names|hwmon_sensor_label)"
              action: keep

processors:
  memory_limiter:
    check_interval: 2s
    limit_mib: 120
    spike_limit_mib: 30
  batch:
    send_batch_size: 1024
    timeout: 5s
  resourcedetection:
    detectors: [env, system]
    system:
      hostname_sources: [os]
  resource/host:
    attributes:
      - key: host.name
        value: ${env:HOST_NAME}
        action: upsert
      - key: service.name
        value: ec2-host
        action: insert

exporters:
  otlphttp/openobserve:
    endpoint: http://127.0.0.1:5080/api/default
    headers:
      Authorization: Basic ${env:O2_AUTH}
      stream-name: default
    retry_on_failure:
      enabled: true
      max_elapsed_time: 120s

extensions:
  health_check:
    endpoint: 127.0.0.1:13133

service:
  extensions: [health_check]
  pipelines:
    traces:
      receivers: [otlp]
      processors: [memory_limiter, batch]
      exporters: [otlphttp/openobserve]
    logs:
      receivers: [otlp]
      processors: [memory_limiter, batch]
      exporters: [otlphttp/openobserve]
    metrics/app:
      receivers: [otlp]
      processors: [memory_limiter, batch]
      exporters: [otlphttp/openobserve]
    metrics/host:
      receivers: [hostmetrics, prometheus]
      processors: [memory_limiter, resourcedetection, resource/host, batch]
      exporters: [otlphttp/openobserve]
